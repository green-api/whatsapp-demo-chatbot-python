chat_gpt_intro:
  ru: "🤖 Вы начали разговор с ChatGPT.\n\nЗадавайте любые вопросы, и ChatGPT постарается на них ответить.\n\nЧтобы вернуться в главное меню, напишите *меню*, *выход*, *стоп* или *назад*."
  en: "🤖 You have started a conversation with ChatGPT.\n\nAsk any questions, and ChatGPT will try to answer them.\n\nTo return to the main menu, type *menu*, *exit*, *stop*, or *back*."
  he: "🤖 התחלת שיחה עם ChatGPT.\n\nשאל כל שאלה, ו-ChatGPT ינסה לענות עליה.\n\nכדי לחזור לתפריט הראשי, הקלד *תפריט*, *יציאה*, *עצור*, *חזור*, *exit* או *menu*."
  es: "🤖 Has iniciado una conversación con ChatGPT.\n\nHaz cualquier pregunta, y ChatGPT intentará responderla.\n\nPara volver al menú principal, escribe *menú*, *salir*, *parar*, *atrás*, *menu* o *exit*."
  ar: ""
  kz: "🤖 Сіз ChatGPT-мен әңгімені бастадыңыз.\n\nКез келген сұрақ қойыңыз, және ChatGPT оларға жауап беруге тырысады.\n\nНегізгі мәзірге оралу үшін *меню*, *мәзір*, *шығу*, *тоқта*, *артқа* деп жазыңыз."
chat_gpt_error:
  ru: "Извините, произошла ошибка при обработке вашего сообщения. Пожалуйста, попробуйте еще раз или вернитесь в меню, набрав *меню*."
  en: "Sorry, there was an error processing your message. Please try again or return to the menu by typing *menu*."
  he: "מצטער, אירעה שגיאה בעיבוד ההודעה שלך. אנא נסה שוב או חזור לתפריט על ידי הקלדת *menu*."
  es: "Lo siento, hubo un error al procesar tu mensaje. Por favor, inténtalo de nuevo o vuelve al menú escribiendo *menu*."
  ar: ""
  kz: "Кешіріңіз, сіздің хабарламаңызды өңдеу кезінде қате орын алды. Қайталап көріңіз немесе *меню* деп жазу арқылы мәзірге оралыңыз."
