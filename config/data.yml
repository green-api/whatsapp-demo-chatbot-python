sending_buttons_notice:
  ru: "Следующие сообщения будут отправлены с использованием методов *SendInteractiveButtons* и *SendInteractiveButtonsReplay*.\nМы будем отправлять интерактивные кнопки и интерактивные кнопки с ответом!\n\n"
  en: "The following messages will be sent using the *SendInteractiveButtons* and *SendInteractiveButtonsReplay* methods.\nWe will send interactive buttons and interactive buttons with a reply in them!\n\n"
  he: "ההודעות הבאות יישלחו באמצעות השיטות *SendInteractiveButtons* ו-*SendInteractiveButtonsReplay*.\nנשלח כפתורים אינטראקטיביים וכפתורים אינטראקטיביים עם תשובה בתוכם!\n\n"
  es: "Los siguientes mensajes se enviarán mediante los métodos *SendInteractiveButtons* y *SendInteractiveButtonsReplay*.\n¡Enviaremos botones interactivos y botones interactivos con una respuesta!\n\n"
  ar: ""
  kz: "Келесі хабарламалар *SendInteractiveButtons* және *SendInteractiveButtonsReplay* әдістері арқылы жіберіледі.\nБіз интерактивті түймелер мен жауаптары бар интерактивті түймелерді жібереміз!\n\n"
buttons_warning:
  ru: "⚠️ Обратите внимание: \nКнопки поддерживаются не во всех версиях приложения. Они будут видны в мобильной и веб-версиях, но *не отображаются в Windows Desktop*.\n"
  en: "⚠️ Please note: \nButtons are not supported in all app versions. They will be visible in the mobile and web apps, but *are not displayed in the Windows Desktop* version.\n"
  he: "⚠️ שימו לב:\n הכפתורים אינם נתמכים בכל גרסאות האפליקציה. הם יהיו גלויים באפליקציית המובייל והדפדפן, אך *לא מוצגים בגרסת Windows Desktop*.\n"
  es: "⚠️ Ten en cuenta: \nLos botones no son compatibles con todas las versiones de la aplicación. Serán visibles en las aplicaciones móviles y web, pero *no se muestran en la versión de Windows Desktop*.\n"
  ar: ""
  kz: "⚠️ Назар аударыңыз: \nТүймелердің барлық қолданба нұсқаларында қолдауы жоқ. Олар мобильді және веб-қолданбаларда көрінеді, бірақ *Windows Desktop нұсқасында көрсетілмейді*.\n"
send_typing_message:
  ru: "Это сообщение отправлено после уведомления о наборе текста.\n\nУведомление отправляется с помощью метода *sendTyping* либо параметра *typingTime* в методах отправки сообщений.\n\nЧтобы узнать, как работает этот метод, перейдите по ссылке:\n"
  en: "This message was sent after the typing notification.\n\nThe notification is sent using the *sendTyping* method or the *typingTime* parameter in message sending methods.\n\nTo learn how this method works, follow the link:\n"
  he: "הודעה זו נשלחה לאחר התראה על הקלדה.\n\nההתראה נשלחת באמצעות השיטה *sendTyping* או הפרמטר *typingTime* בשיטות שליחת הודעות.\n\nכדי ללמוד כיצד השיטה פועלת, עקוב אחר הקישור:\n"
  es: "Este mensaje se envió después de la notificación de escritura.\n\nLa notificación se envía utilizando el método *sendTyping* o el parámetro *typingTime* en los métodos de envío de mensajes.\n\nPara aprender cómo funciona este método, sigue el enlace:\n"
  ar: ""
  kz: "Бұл хабарлама мәтін теріліп жатқан хабарландырудан кейін жіберілді.\n\nХабарландыру *sendTyping* әдісі немесе хабарлама жіберу әдістеріндегі *typingTime* параметрі арқылы жіберіледі.\n\nБұл әдістің қалай жұмыс істейтінін білу үшін сілтемеге өтіңіз:\n"
send_recording_message:
  ru: "Следующее сообщение с аудиофайлом будет отправлено после уведомления о записи голосового сообщения.\n\nУведомление отправляется с помощью метода *sendTyping* либо параметров *typingTime* и *typingType* в методах отправки файлов.\n\nЧтобы узнать, как работает этот метод, перейдите по ссылке:\n"
  en: "The next audio file message will be sent after the voice message recording notification.\n\nThe notification is sent using the *sendTyping* method or the *typingTime* and *typingType* parameters in file sending methods.\n\nTo learn how this method works, follow the link:\n"
  he: "ההודעה הבאה עם קובץ אודיו תישלח לאחר ההתראה על הקלטת הודעת קול.\n\nההתראה נשלחת באמצעות השיטה *sendTyping* או הפרמטרים *typingTime* ו-*typingType* בשיטות שליחת קבצים.\n\nכדי ללמוד כיצד השיטה פועלת, עקוב אחר הקישור:\n"
  es: "El siguiente mensaje con archivo de audio se enviará después de la notificación de grabación de mensaje de voz.\n\nLa notificación se envía utilizando el método *sendTyping* o los parámetros *typingTime* y *typingType* en los métodos de envío de archivos.\n\nPara aprender cómo funciona este método, sigue el enlace:\n"
  ar: ""
  kz: "Келесі аудиофайл хабарламасы дауыстық хабарлама жазылып жатқан хабарландырудан кейін жіберіледі.\n\nХабарландыру *sendTyping* әдісі немесе файл жіберу әдістеріндегі *typingTime* және *typingType* параметрлері арқылы жіберіледі.\n\nБұл әдістің қалай жұмыс істейтінін білу үшін сілтемеге өтіңіз:\n"
