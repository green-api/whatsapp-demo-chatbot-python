menu:
  ru: "\n\nGREEN API предоставляет отправку данных следующих видов. \nВыберите цифру из списка, чтобы проверить как работает метод отправки!\nИсходный код демо чат-бота: https://github.com/green-api/whatsapp-demo-chatbot-python\n\n*1*. Текстовое сообщение 📩\n*2*. Файл 📋\n*3*. Картинка 🖼\n*4*. Аудио 🎵\n*5*. Видео 📽\n*6*. Контакт 📱\n*7*. Геолокация 🌎\n*8*. Опрос ✔\n*9*. Получить картинку моего аватара 👤\n*10*. Отправить ссылку 🔗\n*11*. Создать группу с ботом 👥\n*12*. Цитировать сообщение ©️\n*13*. О PYTHON GREEN API чат-боте 🦎\n*14*. 🔥 Разговор с ChatGPT 🤖\n*15*. Интерактивные кнопки 📌\n*16*. Уведомление о наборе текстового сообщения ✒️\n*17*. Уведомление о записи аудиосообщения 🎙️\n\nЧтобы вернуться в начало напишите *стоп* или *0*"
  en: "\n\nGREEN API provides the following kinds of message services. \nType in a number to see how the corresponding method works!\nDemo chatbot source code: https://github.com/green-api/whatsapp-demo-chatbot-python\n\n*1*. Text message 📩\n*2*. File 📋\n*3*. Image 🖼\n*4*. Audio 🎵\n*5*. Video 📽\n*6*. Contact 📱\n*7*. Location 🌎\n*8*. Poll ✔\n*9*. Get image of my avatar 👤\n*10*. Send link 🔗\n*11*. Create group with bot 👥\n*12*. Quote message ©️\n*13*. About PYTHON GREEN API chatbot 🦎\n*14*. 🔥 Conversation with ChatGPT 🤖\n*15*. Interactive buttons 📌\n*16*. Typing notification ✒️\n*17*. Audio recording notification 🎙️\n\nTo restart the conversation type *stop* or *0*"
  he: "\n\nGREEN API מספק את סוגי שירותי ההודעות הבאים. \nהקלד מספר כדי לראות כיצד פועלת השיטה המתאימה!\nקוד המקור של הצ'אטבוט ההדגמה: https://github.com/green-api/whatsapp-demo-chatbot-python\n\n*1*. הודעת טקסט 📩\n*2*. קובץ 📋\n*3*. תמונה 🖼\n*4*. אודיו 🎵\n*5*. סרטון 📽\n*6*. איש קשר 📱\n*7*. מיקום 🌎\n*8*. סקר ✔\n*9*. קבל תמונה של הדמות שלי 👤\n*10*. שלח קישור 🔗\n*11*. צור קבוצה עם בוט 👥\n*12*. ציטוט הודעה ©️\n*13*. אודות PYTHON GREEN API צ'אט-בוט 🦎\n*14*. 🔥 שיחה עם ChatGPT 🤖\n*15*. כפתורים אינטראקטיביים 📌\n*16*. שלח התראה בעת הקלדת הודעה ✒️\n*17*. שלח התראה על הקלטת הודעת קול 🎙️\n\nכדי להתחיל את השיחה מחדש, הקלד *stop* או *0*"
  es: "\n\nGREEN API proporciona los siguientes tipos de servicios de mensajes. \n¡Escriba un número para ver cómo funciona el método correspondiente!\nCódigo fuente del chatbot de demostración: https://github.com/green-api/whatsapp-demo-chatbot-python\n\n*1*. Mensaje de texto 📩\n*2*. Archivo 📋\n*3*. Imagen 🖼\n*4*. Audio 🎵\n*5*. Video 📽\n*6*. Contacto 📱\n*7*. Ubicación 🌎\n*8*. Encuesta ✔\n*9*. Obtener imagen de mi avatar 👤\n*10*. Enviar enlace 🔗\n*11*. Crear grupo con bot 👥\n*12*. Mensaje citado ©️\n*13*. Acerca de PYTHON GREEN API chatbot 🦎\n*14*. 🔥 Conversación con ChatGPT 🤖\n*15*. Botones interactivos 📌\n*16*. Enviar notificación de escritura ✒️\n*17*. Enviar notificación de grabación de audio 🎙️\n\nPara reiniciar la conversación escriba *stop* o *0*"
  ar: ""
  kz: "\n\nGREEN API келесі көрсетілген түрдегі деректерді жіберуді қамтамасыз етеді. \nЖіберу әдістерін тексеру үшін тізімнен сан таңдаңыз!\nДемо чатботтың бастапқы коды: https://github.com/green-api/whatsapp-demo-chatbot-python\n\n*1*. Мәтінді хабарлама 📩\n*2*. Файл 📋\n*3*. Сурет 🖼\n*4*. Аудио 🎵\n*5*. Видео 📽\n*6*. Контакт 📱\n*7*. Геолокация 🌎\n*8*. Сауалнама ✔\n*9*. Менің аватарымның суретін алу 👤\n*10*. Сілтеме жіберу 🔗\n*11*. Ботпен топ құру 👥\n*12*. Хабарламаға дәйексөз келтіру ©️\n*13*. PYTHON GREEN API чат-боты туралы 🦎\n*14*. 🔥 ChatGPT-мен әңгімелесу 🤖\n*15*. Интерактивті түймелер 📌\n*16*. Мәтіндік хабарлама теріліп жатқанда хабарландыру жіберу ✒️\n*17*. Аудиохабарлама жазылып жатқанда хабарландыру жіберу 🎙️\n\nБасына оралу үшін *стоп* немесе *0* деп жазыңыз"
